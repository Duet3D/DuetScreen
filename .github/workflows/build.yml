name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build DuetScreen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DuetScreen
        uses: actions/checkout@v4
        with:
          path: DuetScreen
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag is signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          REPO="${GITHUB_REPOSITORY}"
          API="https://api.github.com/repos/${REPO}"

          echo "Checking pushed tag: ${TAG_NAME}"
          REF_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/git/ref/tags/${TAG_NAME}")

          read -r OBJ_TYPE OBJ_SHA < <(printf '%s' "${REF_JSON}" | python3 -c 'import json,sys; j=json.load(sys.stdin); print(j["object"]["type"], j["object"]["sha"])')

          if [ "${OBJ_TYPE}" != "tag" ]; then
            echo "Tag '${TAG_NAME}' is not an annotated tag (type=${OBJ_TYPE})." >&2
            echo "Only signed annotated tags are allowed to trigger this workflow." >&2
            exit 1
          fi

          TAG_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/git/tags/${OBJ_SHA}")

          IFS=$'\t' read -r VERIFIED REASON HAS_SIGNATURE TAGGER_NAME TAGGER_EMAIL < <(printf '%s' "${TAG_JSON}" | python3 -c 'import json,sys; j=json.load(sys.stdin); v=(j.get("verification") or {}); t=(j.get("tagger") or {}); verified=v.get("verified", False); reason=v.get("reason") or "unknown"; sig=bool(v.get("signature")); name=t.get("name") or "unknown"; email=t.get("email") or "unknown"; print(str(verified).lower(), reason, "yes" if sig else "no", name, email, sep="\t")')

          if [ "${VERIFIED}" != "true" ] || [ "${HAS_SIGNATURE}" != "yes" ]; then
            echo "Tag '${TAG_NAME}' is not signed and verified (verified=${VERIFIED}, reason=${REASON})." >&2
            exit 1
          fi

          echo "Signer: ${TAGGER_NAME} <${TAGGER_EMAIL}>"
          echo "Tag '${TAG_NAME}' is signed and verified."

      - name: Checkout Buildroot
        uses: actions/checkout@v4
        with:
          repository: Duet3D/buildroot-duetscreen
          ref: master
          path: buildroot-duetscreen
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Determine latest Buildroot tag on master
        id: buildroot_tag
        run: |
          cd buildroot-duetscreen
          # Ensure full history (in case fetch-depth was not 0 for some reason)
          git fetch --prune --tags --force origin +refs/heads/master:refs/remotes/origin/master
          if git rev-parse --is-shallow-repository >/dev/null 2>&1 && git rev-parse --is-shallow-repository | grep -q true; then
            git fetch --unshallow || true
          fi
          # Try to get most recent tag reachable from master by tag creation date
          LATEST_TAG=$(git tag --merged origin/master --sort=-creatordate | head -n1)
          # Fallback: most recent annotated tag overall if above fails
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | head -n1)
          fi
          if [ -z "$LATEST_TAG" ]; then
            echo "No tag found; staying on master" >&2
            echo "BUILDROOT_TAG=master" >> $GITHUB_ENV
            echo "BUILDROOT_TAG=master" >> $GITHUB_OUTPUT
          else
            # Verify tag commit is on master; if not, just use master
            if git merge-base --is-ancestor $(git rev-list -n1 $LATEST_TAG) origin/master; then
              echo "Using buildroot tag: $LATEST_TAG"
              git checkout "$LATEST_TAG"
              echo "BUILDROOT_TAG=$LATEST_TAG" >> $GITHUB_ENV
              echo "BUILDROOT_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT
            else
              echo "Tag $LATEST_TAG not ancestor of master; staying on master" >&2
              echo "BUILDROOT_TAG=master" >> $GITHUB_ENV
              echo "BUILDROOT_TAG=master" >> $GITHUB_OUTPUT
            fi
          fi
          # Record the commit SHA actually used
          BUILDROOT_SHA=$(git rev-parse --short HEAD)
          echo "BUILDROOT_SHA=$BUILDROOT_SHA" >> $GITHUB_ENV
          echo "BUILDROOT_SHA=$BUILDROOT_SHA" >> $GITHUB_OUTPUT

      - name: Restore Buildroot seed (artifact workaround for tag cache isolation)
        id: restore_buildroot
        # if: ${{ steps.buildroot_tag.outputs.BUILDROOT_TAG != 'master' }}
        if: false # DISABLE FOR NOW - artifact storage quota issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDROOT_TAG: ${{ steps.buildroot_tag.outputs.BUILDROOT_TAG }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="buildroot-seed-${BUILDROOT_TAG}"
          echo "Attempting to restore seed artifact: $ARTIFACT_NAME"
          # Ensure tools present (jq, unzip, rsync)
          for pkg in jq unzip rsync; do
            if ! command -v $pkg >/dev/null 2>&1; then
              echo "Installing missing package: $pkg"; sudo apt-get update && sudo apt-get install -y jq unzip rsync; break; fi
          done
          RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")
          URL=$(echo "$RESP" | jq -r --arg NAME "$ARTIFACT_NAME" '.artifacts | sort_by(.created_at) | reverse | .[] | select(.name==$NAME and .expired==false) | .archive_download_url' | head -n1)
          if [ -n "$URL" ] && [ "$URL" != "null" ]; then
            echo "Found artifact. Downloading..."
            curl -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$URL" -o seed.zip
            rm -rf seed && mkdir seed
            unzip -q seed.zip -d seed
            # If the artifact now contains compressed seed archives (dl.zip/output.zip), extract them
            if [ -f seed/dl.zip ]; then
              echo "Expanding dl.zip"
              unzip -q seed/dl.zip -d seed
            fi
            if [ -f seed/output.zip ]; then
              echo "Expanding output.zip"
              unzip -q seed/output.zip -d seed
            fi
            mkdir -p buildroot-duetscreen/dl buildroot-duetscreen/output
            # Move (not copy) the restored directories into place to save time and disk space.
            # Remove any existing directories first to avoid mv nesting.
            rm -rf buildroot-duetscreen/dl buildroot-duetscreen/output || true
            if [ -d seed/dl ]; then
              mv seed/dl buildroot-duetscreen/
            fi
            if [ -d seed/output ]; then
              mv seed/output buildroot-duetscreen/
            fi
            # Clean up any remaining seed artifacts
            rm -rf seed seed.zip || true
            echo "SEED_RESTORED=1" >> $GITHUB_OUTPUT
          else
            echo "No existing seed artifact found (cold build)."
            echo "SEED_RESTORED=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate Changelog
        id: changelog
        working-directory: DuetScreen
        run: |   
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          if [ "${BUILDROOT_TAG}" = "master" ]; then
            echo "Buildroot: master@${BUILDROOT_SHA} (commit: https://github.com/Duet3D/buildroot-duetscreen/commit/${BUILDROOT_SHA})" | tee -a $GITHUB_ENV >> $GITHUB_OUTPUT
          else
            echo "Buildroot: [${BUILDROOT_TAG}](https://github.com/Duet3D/buildroot-duetscreen/releases/tag/${BUILDROOT_TAG}) (commit: [${BUILDROOT_SHA}](https://github.com/Duet3D/buildroot-duetscreen/commit/${BUILDROOT_SHA}))" | tee -a $GITHUB_ENV >> $GITHUB_OUTPUT
          fi
          echo "" | tee -a $GITHUB_ENV >> $GITHUB_OUTPUT
          ./scripts/release_notes.sh | tee -a $GITHUB_ENV >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install Linux Dependencies
        run: |
          cd DuetScreen
          ./scripts/install_prerequisites.sh
          cd ../buildroot-duetscreen
          ./scripts/install_prerequisites.sh
      
      - name: Get Source Branch
        id: branch
        working-directory: DuetScreen
        run: |
          TAG_SHA=$(git rev-parse ${{ github.ref }})
          echo "Tag SHA: $TAG_SHA"
          BRANCHES=$(git branch -r --contains $TAG_SHA)
          echo "Git branches containing tag:"
          echo "$BRANCHES"
          BRANCH=$($BRANCHES | grep -v "HEAD detached" | head -n1 | tr -d '* ' | sed 's/^  origin\///' | xargs)
          echo "SOURCE_BRANCH=${BRANCH}" >> $GITHUB_ENV

      - name: Build DuetScreen
        working-directory: buildroot-duetscreen
        env:
          SEED_RESTORED: ${{ steps.restore_buildroot.outputs.SEED_RESTORED }}
        run: |
          if [ "${SEED_RESTORED}" = "1" ]; then
            echo "Using restored seed (incremental build)"
            rm -rf output/build/duetscreen-HEAD || true
            rm -rf dl/duetscreen || true
          else
            echo "No seed: performing clean prerequisites"
            make clean || true
          fi
          make duet3d_duetscreen_defconfig
          DUETSCREEN_SRC="../DuetScreen" DUETSCREEN_PRESET="T113-Release" make duetscreen-rebuild

      - name: Build sdcard.img
        working-directory: buildroot-duetscreen
        run: |
          # Ensure config is applied (idempotent) & build full image; cached objects accelerate this
          make duet3d_duetscreen_defconfig
          DUETSCREEN_SRC="../DuetScreen" DUETSCREEN_PRESET="T113-Release" make

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir artifacts
          cp ./buildroot-duetscreen/output/images/sdcard.img ./artifacts/
          cp ./buildroot-duetscreen/output/images/update.tar.gz ./artifacts/nand_update.tar.gz
          cd DuetScreen
          ./scripts/create_upgrade.sh
          cp ./out/DuetScreen.tar.gz ../artifacts/

      - name: Upload artifacts
        if : false # DISABLE FOR NOW - artifact storage quota issues
        uses: actions/upload-artifact@v4
        with:
          name: DuetScreen
          path: artifacts/*

      - name: Check Branch
        working-directory: DuetScreen
        id: check_branch
        run: |
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "IS_MASTER=$([[ "$BRANCH_NAME" == "master" ]] && echo "true" || echo "false")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          prerelease: ${{ steps.check_branch.outputs.IS_MASTER != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Prepare Buildroot seed archives
        # if: ${{ steps.buildroot_tag.outputs.BUILDROOT_TAG != 'master' && steps.restore_buildroot.outputs.SEED_RESTORED == '0' }}
        if: false # DISABLE FOR NOW - artifact storage quota issues
        run: |
          set -euo pipefail
          cd buildroot-duetscreen
          if ! command -v zip >/dev/null 2>&1; then
            echo "Installing zip utility"; sudo apt-get update && sudo apt-get install -y zip; fi
          # Create zipped copies of dl and output preserving symlinks (-y)
          rm -f dl.zip output.zip
          zip -qry dl.zip dl
          zip -qry output.zip output
          ls -lh dl.zip output.zip

      - name: Upload Buildroot seed artifact
        # if: ${{ steps.buildroot_tag.outputs.BUILDROOT_TAG != 'master' && steps.restore_buildroot.outputs.SEED_RESTORED == '0' }}
        if: false # DISABLE FOR NOW - artifact storage quota issues
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-seed-${{ steps.buildroot_tag.outputs.BUILDROOT_TAG }}
          path: |
            buildroot-duetscreen/dl.zip
            buildroot-duetscreen/output.zip