# GitHub Action: Verify i18n Translation Files
#
# This workflow runs on pull requests and pushes to main, and checks that all translation files
# are in sync with the reference (en-GB.json) using the manage_translations.py script.
#
# Fails if any translation file is missing keys, has extra keys, or has format mismatches.

name: Verify i18n Translations

on:
  pull_request:
  push:
    paths:
      - 'assets/i18n/*.json'
      - 'scripts/manage_translations.py'

jobs:
  image:
    uses: ./.github/workflows/devcontainer.yml
    permissions:
      contents: read
      packages: write

  check-translations:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check translation files
        run: |
          python scripts/manage_translations.py --show-keys
