name: C/C++ CI

on:
    push:
    pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
    image:
        uses: ./.github/workflows/devcontainer.yml
        permissions:
            contents: read
            packages: write

    test:
        name: Build DuetScreen & Run CTest (Ubuntu)
        needs: image
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: read
            issues: write
            pull-requests: write
        container:
            image: ${{ needs.image.outputs.image }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

        steps:
            # The checkout is owned by the runner user, not the container's root user
            - run: git config --global --add safe.directory '*'

            - name: Checkout code
              uses: actions/checkout@v4
              with:
                submodules: recursive
                fetch-depth: 1
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: Update Version
              run: |
                ./scripts/update_version.sh "${{ github.ref_name }}"
                echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

            - name: Configure project
              run: cmake --preset Test

            - name: Build project
              run: cmake --build --preset Test

            - name: Run CTest
              id: run_ctest
              run: ctest --test-dir out/build/Test --output-on-failure
            
            - name: Run Coverage
              run: |
                mkdir -p tests/report
                GCOV_EXE="gcov"
                COMPILER=$(sed -n -E 's/^CMAKE_CXX_COMPILER:[^=]*=(.*)$/\1/p' out/build/Test/CMakeCache.txt | head -n 1)
                if [ -z "$COMPILER" ]; then
                  COMPILER=$(sed -n -E 's/^CMAKE_C_COMPILER:[^=]*=(.*)$/\1/p' out/build/Test/CMakeCache.txt | head -n 1)
                fi

                if [ -n "$COMPILER" ]; then
                  COMPILER_BASENAME=$(basename "$COMPILER")
                  MAJOR=$(echo "$COMPILER_BASENAME" | sed -n -E 's/.*-(\d+)$/\1/p')

                  if [ -z "$MAJOR" ] && command -v "$COMPILER" >/dev/null 2>&1; then
                    MAJOR=$("$COMPILER" -dumpfullversion -dumpversion 2>/dev/null | cut -d. -f1)
                  fi

                  if [ -n "$MAJOR" ] && command -v "gcov-$MAJOR" >/dev/null 2>&1; then
                    GCOV_EXE="gcov-$MAJOR"
                  fi
                fi

                echo "Using gcov executable: $GCOV_EXE"
                gcovr out/build/Test --root . --filter src --xml tests/report/coverage.xml -j $(nproc) --print-summary --gcov-executable "$GCOV_EXE"

            - name: Code Coverage Report
              uses: irongut/CodeCoverageSummary@v1.3.0
              with:
                filename: tests/report/coverage.xml
                badge: true
                fail_below_min: false
                format: markdown
                hide_branch_rate: false
                hide_complexity: true
                indicators: true
                output: both
                thresholds: '60 80'
            
            - name: Add Coverage PR Comment
              # Fork PRs get a read-only token, so skip sticky comments there.
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                recreate: true
                path: code-coverage-results.md

            - name: Detect error images
              id: detect_err_images
              if: always()
              run: |
                ERR_FILES=$(find tests/ref_imgs -type f -name "*_err.*" || true)
                ERR_COUNT=$(printf "%s\n" "$ERR_FILES" | sed '/^$/d' | wc -l)
                if [ "$ERR_COUNT" -gt 0 ]; then
                  echo "has_errors=true" >> "$GITHUB_OUTPUT"
                  echo "Found $ERR_COUNT error image(s)."
                  # List them for the log
                  printf "%s\n" "$ERR_FILES"
                  # Expose a multiline output with all error image paths
                  {
                    echo "error_files<<EOF"
                    printf "%s\n" "$ERR_FILES"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"
                else
                  echo "has_errors=false" >> "$GITHUB_OUTPUT"
                  echo "No error images found."
                fi

            - name: Upload error images artifact
              if: always() && steps.detect_err_images.outputs.has_errors == 'true'
              uses: actions/upload-artifact@v4
              with:
                name: ctest-error-images
                path: ${{ steps.detect_err_images.outputs.error_files }}
                if-no-files-found: error

    # The devcontainer is Linux only, so macOS still installs its own dependencies. It only checks
    # that the project builds: lvgl renders `_` differently on Linux and macOS, so the tests are not
    # run here until lvgl is updated.
    macos:
        name: Build DuetScreen (MacOS)
        runs-on: macos-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                submodules: recursive
                fetch-depth: 1
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install dependencies
              run: ./scripts/install_prerequisites.sh

            - name: Update Version
              run: |
                ./scripts/update_version.sh "${{ github.ref_name }}"
                echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

            - name: Configure project
              run: cmake --preset Test -D ENABLE_COVERAGE=OFF

            - name: Build project
              run: cmake --build --preset Test
