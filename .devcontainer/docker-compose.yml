services:
  dev:
    build:
      # The repository root, so the Dockerfile can COPY requirements.txt.
      # .devcontainer/Dockerfile.dockerignore keeps everything else out of the
      # context so the whole repository is not shipped to the daemon.
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    command: sleep infinity
    environment:
      # X11 passthrough so the SDL simulation can open a window on the host
      # display. Works on a Linux host and under WSLg on WSL2.
      DISPLAY: "${DISPLAY:-:0}"
    volumes:
      - type: bind
        source: ..
        target: /workspaces/DuetScreen
      # Host X11 socket. See docs/DEVELOPMENT.md for the one-off `xhost` step.
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
